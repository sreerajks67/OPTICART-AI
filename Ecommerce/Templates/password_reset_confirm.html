<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set New Password - OptiCart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f1f3f6;
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
}
.navbar-brand {
    font-weight: bold;
    color: #fff !important;
}

/* SECTION */
.reset-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* CARD */
.reset-card {
    width: 100%;
    max-width: 450px;
    padding: 30px;
    border-radius: 15px;
    background: #fff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* INPUT */
.form-control {
    border-radius: 10px;
    margin-bottom: 15px;
}

/* BUTTON */
.btn-main {
    background: #2874f0;
    color: white;
    border-radius: 8px;
}
.btn-main:hover {
    background: #0d6efd;
}

/* TEXT */
h3 {
    text-align: center;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home1' %}">OptiCart</a>
  </div>
</nav>

<!-- RESET PASSWORD -->
<div class="reset-section">

  <div class="reset-card">

    <h3>🔐 Set New Password</h3>

    <form method="POST">
      {% csrf_token %}

      <!-- Django Form Fields -->
      {{ form.new_password1.label_tag }}
      {{ form.new_password1 }}

      {{ form.new_password2.label_tag }}
      {{ form.new_password2 }}

      <button type="submit" class="btn btn-main w-100 mt-3">
        Update Password
      </button>
    </form>

  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
