<!DOCTYPE html>
<html>
<head>
    <title>Categories - OptiCart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .navbar-brand {
            font-weight: 700;
            color: white !important;
        }

        .nav-link {
            color: #ddd !important;
        }

        .nav-link:hover {
            color: #ff4d4d !important;
        }

        /* HERO BACKGROUND */
        .hero {
            min-height: 100vh;
            padding-top: 100px;

            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae');
            background-size: cover;
            color: white;
        }

        h3 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 0.8s ease;
        }

        /* CATEGORY CARD */
        .category-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .category-card:hover {
            transform: translateY(-10px) scale(1.03);
            background: rgba(255,255,255,0.18);
        }

        .category-icon {
            font-size: 38px;
            margin-bottom: 15px;
            color: #ff4d4d;
        }

        .category-name {
            font-size: 18px;
            font-weight: 600;
        }

        /* ANIMATION */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">

    <a class="navbar-brand" href="{% url 'home' %}">🛒 OptiCart</a>

    <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#nav">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'products' %}">
            <i class="fas fa-shopping-bag"></i> Shop
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'cart_page' %}">
            <i class="fas fa-shopping-cart"></i> Cart
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'logout' %}">
            Logout
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- HERO SECTION -->
<div class="hero">
<div class="container">

    <h3>🛍 Browse Categories</h3>

    <div class="row">

        {% for category in categories %}
        <div class="col-md-3 col-sm-6 mb-4">

            <a href="#" style="text-decoration:none; color:white;">
                <div class="category-card">

                    <div class="category-icon">
                        <!-- OPTIONAL: random icon logic -->
                        <i class="fas fa-layer-group"></i>
                    </div>

                    <div class="category-name">
                        {{ category.name }}
                    </div>

                </div>
            </a>

        </div>
        {% endfor %}

    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
