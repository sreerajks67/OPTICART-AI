<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - OptiCart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
/* ========== PREMIUM DARK/LIGHT THEME ========== */
:root {
    --crimson: #ff3366;
    --crimson-dark: #e62e5c;
    --amber: #ffb347;
    --crimson-glow: rgba(255, 51, 102, 0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
}

/* Dark Theme (default) */
body.dark-theme {
    background: linear-gradient(135deg, #0a0c15 0%, #121826 30%, #0f172a 60%, #1a1b2e 100%);
    color: #ffffff;
}

body.dark-theme::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.12), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 180, 71, 0.08), transparent 60%);
    pointer-events: none;
    z-index: -2;
}

/* Light Theme */
body.light-theme {
    background: linear-gradient(135deg, #fef9f5 0%, #fff5f0 30%, #fef5e8 60%, #fff0e6 100%);
    color: #1a1a2e;
}

body.light-theme::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.06), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 180, 71, 0.04), transparent 60%);
    pointer-events: none;
    z-index: -2;
}

/* NAVBAR */
.navbar {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(12px);
    padding: 1rem 0;
    border-bottom: 1px solid rgba(255, 51, 102, 0.2);
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

body.light-theme .navbar {
    background: rgba(255, 255, 255, 0.9);
    border-bottom: 1px solid rgba(255, 51, 102, 0.15);
}

.navbar-brand {
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, var(--crimson), var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

body.light-theme .navbar-brand {
    background: linear-gradient(135deg, #1a1a2e, var(--crimson), var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
}

/* Theme Toggle Button */
.theme-toggle {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 51, 102, 0.3);
    border-radius: 40px;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

body.light-theme .theme-toggle {
    background: rgba(0, 0, 0, 0.05);
    border-color: rgba(255, 51, 102, 0.3);
}

.theme-toggle:hover {
    background: rgba(255, 51, 102, 0.2);
    border-color: var(--crimson);
}

.theme-toggle i {
    font-size: 1rem;
    transition: transform 0.3s ease;
}

body.dark-theme .theme-toggle i {
    color: #ffb347;
}

body.light-theme .theme-toggle i {
    color: #e11d48;
}

/* LOGIN SECTION */
.login-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 60px;
}

/* LOGIN CARD - Glassmorphism */
.login-card {
    width: 100%;
    max-width: 440px;
    padding: 40px 35px;
    border-radius: 32px;
    backdrop-filter: blur(20px);
    transition: all 0.3s ease;
    animation: fadeInUp 0.6s ease forwards;
}

body.dark-theme .login-card {
    background: rgba(18, 22, 40, 0.7);
    border: 1px solid rgba(255, 51, 102, 0.2);
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
}

body.light-theme .login-card {
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 51, 102, 0.2);
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.08);
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.login-card h3 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    text-align: center;
    background: linear-gradient(135deg, var(--crimson), var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* Form Labels */
.form-label {
    font-weight: 500;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
}

body.dark-theme .form-label {
    color: rgba(255, 255, 255, 0.8);
}

body.light-theme .form-label {
    color: #1a1a2e;
}

/* Form Inputs */
.form-control {
    border-radius: 60px;
    padding: 12px 20px;
    font-size: 0.9rem;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
}

body.dark-theme .form-control {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
}

body.light-theme .form-control {
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(0, 0, 0, 0.1);
    color: #1a1a2e;
}

.form-control:focus {
    outline: none;
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.2);
}

body.dark-theme .form-control::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

body.light-theme .form-control::placeholder {
    color: rgba(0, 0, 0, 0.4);
}

/* Checkbox */
.form-check-input {
    border-radius: 4px;
    cursor: pointer;
}

body.dark-theme .form-check-input {
    background-color: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

body.light-theme .form-check-input {
    background-color: white;
    border-color: rgba(0, 0, 0, 0.2);
}

.form-check-input:checked {
    background-color: var(--crimson);
    border-color: var(--crimson);
}

.form-check-label {
    font-size: 0.85rem;
    margin-left: 0.3rem;
}

body.dark-theme .form-check-label {
    color: rgba(255, 255, 255, 0.7);
}

/* Button */
.btn-main {
    background: linear-gradient(135deg, var(--crimson), var(--amber));
    border: none;
    padding: 14px;
    border-radius: 60px;
    font-weight: 700;
    font-size: 1rem;
    color: white;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px var(--crimson-glow);
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.btn-main::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
}

.btn-main:hover::before {
    left: 100%;
}

.btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px var(--crimson-glow);
}

/* Links */
.forgot-link {
    color: var(--crimson);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.2s;
}

.forgot-link:hover {
    color: var(--amber);
    text-decoration: underline;
}

.register-link {
    color: var(--crimson);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.register-link:hover {
    color: var(--amber);
    text-decoration: underline;
}

body.light-theme .register-link {
    color: #e11d48;
}

/* Alert Messages */
.alert {
    border-radius: 60px;
    padding: 12px 20px;
    font-size: 0.85rem;
    border: none;
    margin-bottom: 1.5rem;
}

.alert-danger {
    background: rgba(255, 51, 102, 0.15);
    color: #ff6b6b;
    border-left: 4px solid var(--crimson);
}

body.light-theme .alert-danger {
    background: rgba(255, 51, 102, 0.1);
    color: #e11d48;
}

.alert-success {
    background: rgba(255, 180, 71, 0.15);
    color: #ffb347;
    border-left: 4px solid var(--amber);
}

/* Divider */
.login-footer {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

body.light-theme .login-footer {
    border-top-color: rgba(0, 0, 0, 0.08);
}

.login-footer p {
    margin-bottom: 0;
    font-size: 0.85rem;
}

body.dark-theme .login-footer p {
    color: rgba(255, 255, 255, 0.6);
}

body.light-theme .login-footer p {
    color: #6a6a8a;
}

/* Responsive */
@media (max-width: 576px) {
    .login-card {
        padding: 30px 25px;
    }

    .login-card h3 {
        font-size: 1.5rem;
    }

    .btn-main {
        padding: 12px;
    }
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 8px;
}

body.dark-theme ::-webkit-scrollbar-track {
    background: #0a0c15;
}

body.light-theme ::-webkit-scrollbar-track {
    background: #f0f0f0;
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, var(--crimson), var(--amber));
    border-radius: 10px;
}
</style>
</head>

<body class="dark-theme">

<!-- NAVBAR -->
<nav class="navbar fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home1' %}">
      <i class="fas fa-shopping-cart" style="font-size: 1.2rem; margin-right: 5px;"></i>
      OptiCart
    </a>
    <div class="theme-toggle" id="themeToggle">
      <i class="fas fa-moon"></i>
      <span>Dark</span>
    </div>
  </div>
</nav>

<!-- LOGIN SECTION -->
<div class="login-section">
  <div class="login-card">
    <h3>
      <i class="fas fa-lock" style="font-size: 1.5rem; margin-right: 8px;"></i>
      Welcome Back
    </h3>

    <!-- ERROR MESSAGES -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">
          <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %}" style="margin-right: 8px;"></i>
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- LOGIN FORM -->
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">
          <i class="fas fa-user"></i> Username
        </label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">
          <i class="fas fa-key"></i> Password
        </label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="{% url 'password_reset' %}" class="forgot-link">
          <i class="fas fa-question-circle"></i> Forgot password?
        </a>
      </div>

      <button type="submit" class="btn-main w-100">
        <i class="fas fa-arrow-right-to-bracket"></i> Login
      </button>
    </form>

    <div class="login-footer">
      <p>
        Don't have an account?
        <a href="{% url 'user_register' %}" class="register-link">
          Create Account <i class="fas fa-arrow-right"></i>
        </a>
      </p>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Theme Toggle Functionality
document.addEventListener('DOMContentLoaded', function() {
    const savedTheme = localStorage.getItem('opticart_theme') || 'dark';
    document.body.classList.add(savedTheme + '-theme');

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');
    const themeText = themeToggle.querySelector('span');

    if(savedTheme === 'dark') {
        themeIcon.className = 'fas fa-moon';
        themeText.textContent = 'Dark';
    } else {
        themeIcon.className = 'fas fa-sun';
        themeText.textContent = 'Light';
    }

    themeToggle.addEventListener('click', function() {
        if(document.body.classList.contains('dark-theme')) {
            document.body.classList.remove('dark-theme');
            document.body.classList.add('light-theme');
            localStorage.setItem('opticart_theme', 'light');
            themeIcon.className = 'fas fa-sun';
            themeText.textContent = 'Light';
        } else {
            document.body.classList.remove('light-theme');
            document.body.classList.add('dark-theme');
            localStorage.setItem('opticart_theme', 'dark');
            themeIcon.className = 'fas fa-moon';
            themeText.textContent = 'Dark';
        }
    });
});
</script>

</body>
</html>
