<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout - OptiCart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
}
.navbar-brand {
    color: #fff !important;
    font-weight: 700;
}

/* HERO BACKGROUND */
.hero {
    min-height: 100vh;
    padding-top: 120px;
    padding-bottom: 50px;

    background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae');
    background-size: cover;
    background-position: center;
    color: white;
}

/* GLASS CARD */
.glass-card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* BUTTON */
.btn-main {
    background: #ff4d4d;
    color: white;
    border-radius: 30px;
    padding: 12px;
    transition: 0.3s;
}
.btn-main:hover {
    background: #ff1a1a;
    transform: scale(1.05);
}

/* FORM */
.form-control, .form-select {
    border-radius: 12px;
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
}
.form-control::placeholder {
    color: #ddd;
}
.form-control:focus, .form-select:focus {
    box-shadow: none;
    background: rgba(255,255,255,0.2);
}

/* TEXT */
h3, h5 {
    font-weight: 600;
}

/* ITEM ROW */
.item-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

/* MOBILE */
@media(max-width:768px){
    h3 {
        font-size: 1.5rem;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home1' %}">🛒 OptiCart</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
<div class="container">

    <h3 class="text-center mb-4">Checkout 💳</h3>

    <div class="row">

        <!-- CART ITEMS -->
        <div class="col-md-7 mb-4">
            <div class="glass-card">

                <h5>Your Items</h5>
                <hr>

                {% for item in cart_items %}
                <div class="item-row">
                    <span>{{ item.product.name }} (x{{ item.quantity }})</span>
                    <span>₹{{ item.product.price }}</span>
                </div>
                {% endfor %}

                <hr>
                <h5>Total: ₹{{ total }}</h5>

            </div>
        </div>

        <!-- ADDRESS + ORDER -->
        <div class="col-md-5">
            <div class="glass-card">

                <h5>Delivery Details</h5>
                <hr>

                <form method="post" action="{% url 'place_order' %}">
                    {% csrf_token %}

                    <input type="text"
                           name="address"
                           class="form-control mb-3"
                           placeholder="Full Address" required>

                    <select name="payment" class="form-select mb-3">
                        <option>Cash on Delivery</option>
                        <option>UPI</option>
                        <option>Card</option>
                    </select>

                    <button type="submit" class="btn btn-main w-100">
                        Place Order
                    </button>

                </form>

            </div>
        </div>

    </div>

</div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
