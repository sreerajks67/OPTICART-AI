<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Success - OptiCart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
}
.navbar-brand {
    color: #fff !important;
    font-weight: 700;
}

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://images.unsplash.com/photo-1607082350899-7e105aa886ae');
    background-size: cover;
    background-position: center;
    color: white;
    text-align: center;
}

/* GLASS CARD */
.success-card {
    background: rgba(255,255,255,0.08);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeUp 1s ease;
}

/* ICON */
.success-icon {
    font-size: 60px;
    color: #00ffae;
    margin-bottom: 20px;
}

/* BUTTON */
.btn-main {
    background: #ff4d4d;
    color: white;
    border-radius: 30px;
    padding: 12px 30px;
    transition: 0.3s;
}
.btn-main:hover {
    background: #ff1a1a;
    transform: scale(1.08);
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home1' %}">🛒 OptiCart</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="success-card">

        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>

        <h1>Order Placed Successfully!</h1>
        <p class="mt-3">Thank you for shopping with OptiCart 🎉</p>

        <a href="{% url 'products' %}" class="btn btn-main mt-4">
            Continue Shopping
        </a>

    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
